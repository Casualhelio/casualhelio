---
# cPanel Git Version Control deployment.
# "Deploy HEAD Commit" copies the new site (site/: the built output of web/
# on the astro-redesign branch, made by `npm run deploy:build`) into
# public_html. Copying adds and replaces files, never deletes.
# The old site's source (css/, js/, assets/ and the .html files at the top of
# this repository) is no longer copied; to go back to it, revert the commit
# that added site/ and deploy again.
deployment:
  tasks:
    - export DEPLOYPATH=/home/nestmn/public_html
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/.well-known"
    - /bin/cp -f .well-known/security.txt "$DEPLOYPATH/.well-known/"
    - /bin/cp -RfT site "$DEPLOYPATH"
